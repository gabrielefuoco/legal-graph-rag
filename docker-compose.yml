services:
  neo4j:
    image: neo4j:5.26.9
    container_name: legal-graph-neo4j
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    environment:
      - NEO4J_AUTH=${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-password}
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
    volumes:
      - ./neo4j/data:/data
      - ./neo4j/logs:/logs
      - ./neo4j/plugins:/plugins

  ollama:
    image: ollama/ollama:latest
    container_name: legal-graph-ollama
    pull_policy: always
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_KV_CACHE_TYPE=q8_0
    volumes:
      - ./ollama/data:/root/.ollama
      - ./ollama/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  streamlit:
    build: .
    container_name: legal-graph-streamlit
    ports:
      - "8501:8501"
    volumes:
      - .:/app
      - ./models_cache/huggingface:/root/.cache/huggingface
    depends_on:
      neo4j:
        condition: service_started
      ollama:
        condition: service_healthy
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=${NEO4J_USERNAME:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - QWEN3_ENDPOINT=http://ollama:11434
      - HF_HOME=/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      streamlit run src/ui/app.py 
      --server.port=8501 
      --server.address=0.0.0.0

  jupyter:
    build: .
    container_name: legal-graph-jupyter
    ports:
      - "8888:8888"
    volumes:
      - .:/app
      - ./models_cache/huggingface:/root/.cache/huggingface
    depends_on:
      - neo4j
      - ollama
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=${NEO4J_USERNAME:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - QWEN3_ENDPOINT=http://ollama:11434
      - HF_HOME=/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token=''
    profiles:
      - dev
